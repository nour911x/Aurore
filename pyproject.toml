[project]
name = "aurore"
version = "1.0.0"
description = "Assistant IA pour organisateurs d'événements"
requires-python = ">=3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py313"
extend-exclude = ["env", "dossiers"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM117"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.mypy]
python_version = "3.13"
files = ["config", "donnees", "metier", "textes.py"]
ignore_missing_imports = true
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["donnees", "metier", "config", "textes"]
