[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[server]
maxUploadSize = 20
enableStaticServing = true

[theme]
base = "light"
primaryColor = "#471A30"
backgroundColor = "#F8F1EE"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2B0E20"
linkColor = "#84572A"
borderColor = "#EBDDD8"
redTextColor = "#8B2340"
orangeTextColor = "#84572A"
yellowTextColor = "#84572A"
greenTextColor = "#426043"
grayTextColor = "#6E5A63"
blueTextColor = "#6E5A63"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "12px"
buttonRadius = "12px"
baseFontSize = 16
font = "Jost:https://fonts.googleapis.com/css2?family=Jost:wght@300..500&display=swap"
headingFont = "Gilda Display:https://fonts.googleapis.com/css2?family=Gilda+Display&display=swap"
headingFontWeights = 400

[theme.sidebar]
primaryColor = "#C79A5B"
backgroundColor = "#2B0E20"
secondaryBackgroundColor = "#3A172B"
textColor = "#F8F1EE"
linkColor = "#C79A5B"
borderColor = "#55364A"
