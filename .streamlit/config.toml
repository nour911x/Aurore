[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#B9506F"
backgroundColor = "#FFFBF8"
secondaryBackgroundColor = "#F8EDEF"
textColor = "#3A2731"
linkColor = "#A3415F"
borderColor = "#EFE1E5"
showWidgetBorder = false
showSidebarBorder = false
baseRadius = "16px"
buttonRadius = "999px"
baseFontSize = 15
font = "Jost:https://fonts.googleapis.com/css2?family=Jost:wght@300..600&display=swap"
headingFont = "Cormorant Garamond:https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap"
metricValueFontWeight = 500
